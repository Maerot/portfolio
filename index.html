  <style>
    /* CSS Variables for Dynamic Theming */
    :root {
      /* Thème par défaut: Karashi & Ruri (Wada 1) */
      --bg0:#060a12; --bg1:#0a111c; --bg2:#101926; --bg3:#162333;
      --gold:#d0af4c; --goldL:#e6cc7a; --goldD:#9c8031;
      --azure:#2a5ca8; --azureL:#5086d9;
      --chalk:#eae6db; --silver:#94a0b3; --slate:#435c75; --dim:#1c2838;
      --emerald:#789c65; --coral:#c7645d; --lilac:#5e7a96;
      
      --font-display: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      --font-ui: 'DM Sans', 'Manrope', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background: var(--bg0); }
    body { 
      font-family: var(--font-ui); color: var(--chalk); background: var(--bg0);
      overflow-x: hidden; -webkit-font-smoothing: antialiased; 
      transition: background 0.5s ease, color 0.5s ease;
    }
    
    ::selection { background: var(--gold); color: var(--bg0); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg0); }
    ::-webkit-scrollbar-thumb { background: var(--slate); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 4px; }
    
    @media(pointer: fine) { html, body, a, button, [role=button], .glossary-term { cursor: none !important; } }

    /* Elegant Preloader */
    #preloader {
      position: fixed; inset: 0; z-index: 99999; background: var(--bg0);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }
    .loader-logo {
      width: 60px; height: 60px;
      animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 12px var(--gold)); }
      50% { opacity: 0.5; transform: scale(0.95); filter: drop-shadow(0 0 2px var(--gold)); }
    }

    /* Dropdowns */
    .dd { position: relative; display: inline-block; }
    .dd-menu { 
      position: absolute; top: calc(100% + 8px); right: 0; background: var(--bg2); 
      border: 1px solid var(--dim); border-radius: 10px; overflow: hidden; z-index: 700; 
      min-width: 148px; box-shadow: 0 16px 48px rgba(0,0,0,.55);
      opacity: 0; transform: translateY(-8px) scale(.96); pointer-events: none; 
      transition: opacity .25s, transform .25s cubic-bezier(.34,1.56,.64,1);
      max-height: 350px; overflow-y: auto;
    }
    .dd-menu::-webkit-scrollbar { width: 4px; }
    .dd-menu::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
    .dd.open .dd-menu { opacity: 1; transform: none; pointer-events: all; }
    .dd-opt { 
      display: flex; align-items: center; gap: 9px; padding: 11px 16px; 
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.2px; 
      color: var(--silver); transition: all .15s; border: none; background: none; 
      width: 100%; text-align: left; cursor: pointer; text-decoration: none;
    }
    .dd-opt:hover { background: var(--bg3); color: var(--gold); }
    .dd-opt.active { color: var(--gold); background: rgba(255,255,255,0.05); font-weight: 700; }

    /* Utilities & Animations */
    .flex { display: flex; } .grid { display: grid; } .relative { position: relative; }
    .absolute { position: absolute; } .w-full { width: 100%; } .h-full { height: 100%; }
    
    @keyframes shimmer { 0% { background-position: -300% 0; } 100% { background-position: 300% 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(16,214,138,0.55); } 70% { box-shadow: 0 0 0 10px transparent; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes flowArc { to { stroke-dashoffset: 0; } }

    /* Cards - Spotlight Only */
    .gc { 
      transition: transform .45s cubic-bezier(.23,1,.32,1), box-shadow .45s ease, border-color .3s; 
      position: relative; overflow: hidden;
    }
    .gc::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: radial-gradient(400px circle at var(--mouse-x, -500px) var(--mouse-y, -500px), rgba(255,255,255,0.06), transparent 40%);
      opacity: 0; transition: opacity 0.5s ease; pointer-events: none; z-index: 1;
    }
    .gc:hover::before { opacity: 1; }
    .gc > * { position: relative; z-index: 2; }
    .gc:hover { transform: translateY(-7px) !important; box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 1px var(--gold) !important; border-color: var(--gold) !important; z-index: 10; cursor: pointer;}
    
    .xpc { border-left-color: transparent; }

    .pj .pov { opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .4s; }
    .pj:hover .pov { opacity: 1; transform: none; }
    .pj .pbg { transition: transform .7s cubic-bezier(.2,.8,.2,1); }
    .pj:hover .pbg { transform: scale(1.07); }

    /* Glossary Tooltips */
    .glossary-term { border-bottom: 1px dashed var(--gold); color: var(--gold); position: relative; display: inline-block; }
    .glossary-term:hover::after {
      content: attr(data-def); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      background: rgba(10, 17, 28, 0.95); border: 1px solid var(--gold); color: var(--chalk); padding: 8px 12px;
      border-radius: 8px; font-size: 11px; font-family: var(--font-ui); white-space: normal;
      width: max-content; max-width: 220px; z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px); text-align: center; pointer-events: none;
    }

    /* Intersection Observer Reveals */
    .reveal { opacity: 0; transform: translateY(28px) scale(.98); transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    .reveal.on { opacity: 1; transform: none; }

    /* Responsive */
    .pcnav { display: flex !important; } .burg { display: none !important; }
    @media(max-width: 1100px) { .sdots { display: none !important; } }
    @media(max-width: 900px) { .b7, .b5, .b12 { grid-column: 1 / -1 !important; } .c2 { grid-template-columns: 1fr !important; } .pjg { grid-template-columns: 1fr !important; } }
    @media(max-width: 720px) { .pcnav { display: none !important; } .burg { display: flex !important; } .hsg { grid-template-columns: 1fr 1fr !important; } .edg { grid-template-columns: 1fr !important; } }
    
    .shimmer-text { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% 100%; animation: shimmer 4s linear infinite; }

    /* Table styles (pour les modales) */
    .kpi-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; text-align: right; margin: 24px 0;}
    .kpi-table th { padding: 12px; font-weight: 600; border-bottom: 1px solid var(--dim); color: var(--chalk); }
    .kpi-table td { padding: 12px; border-bottom: 1px solid var(--dim); color: var(--silver); }
    .kpi-table .text-left { text-align: left; }
    .kpi-table .text-center { text-align: center; }
    .kpi-table th.top-hdr { border-bottom: none; padding-bottom: 4px; font-size: 11px; letter-spacing: 1px; color: var(--gold); }
    .kpi-table .total-row td { font-weight: 700; color: var(--chalk); border-top: 1px solid var(--slate); }

    /* Modal System */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(6, 10, 18, 0.85); backdrop-filter: blur(8px);
      z-index: 999999; display: flex; justify-content: flex-end; opacity: 0; pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-content {
      width: 100%; max-width: 700px; height: 100%; background: var(--bg1); border-left: 1px solid var(--dim);
      box-shadow: -20px 0 60px rgba(0,0,0,0.5); transform: translateX(100%);
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
    }
    .modal-overlay.open .modal-content { transform: translateX(0); }
    .modal-header { padding: 32px 40px; border-bottom: 1px solid var(--dim); position: sticky; top: 0; background: var(--bg1); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: var(--bg3); border: 1px solid var(--dim); color: var(--silver); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
    .modal-close:hover { background: var(--coral); color: #fff; border-color: var(--coral); transform: rotate(90deg); }
    .modal-body { padding: 40px; flex: 1; font-family: var(--font-ui); color: var(--silver); line-height: 1.7; font-size: 15px; }
    .modal-body h4 { font-family: var(--font-display); font-size: 24px; color: var(--chalk); margin: 32px 0 16px; font-weight: 600; }
    .modal-body p { margin-bottom: 16px; }
    .modal-body ul { margin-bottom: 24px; padding-left: 20px; }
    .modal-body li { margin-bottom: 8px; }

    /* 3D Flip Card Hero (Profil Analytique) */
    .flip-container { perspective: 1000px; cursor: pointer; display: inline-block; position: relative; }
    .flip-container:hover .flipper, .flip-container.flipped .flipper { transform: rotateY(180deg); }
    .flipper { transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; position: relative; width: 220px; height: 220px; z-index:2; }
    .front, .back { backface-visibility: hidden; position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
    .front { border: 4px solid var(--gold); box-shadow: 0 8px 32px rgba(201,168,76,0.3); z-index: 2; transform: rotateY(0deg); }
    .back { border: 4px solid var(--azure); background: var(--bg2); transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(30,122,255,0.4); }
    .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--azure); box-shadow: 0 0 10px var(--azureL), 0 0 20px var(--azureL); animation: scanline 2.5s ease-in-out infinite; opacity: 0.8; z-index: 10; }
    @keyframes scanline { 0%, 100% { top: 0; } 50% { top: 100%; } }
    .hint-toast { position: absolute; right: -80px; top: 20px; background: var(--bg3); border: 1px solid var(--dim); color: var(--silver); padding: 6px 12px; border-radius: 8px; font-family: var(--font-ui); font-size: 11px; opacity: 0; transform: translateX(-10px); transition: all 0.4s; pointer-events: none; }
    .flip-container:hover .hint-toast { opacity: 1; transform: translateX(0); }

    /* 3D Flip Card Business Card (Footer) */
    .bcard-container { perspective: 1200px; cursor: pointer; display: block; width: 100%; max-width: 600px; margin: 0 auto 48px; aspect-ratio: 16/9;}
    .bcard-container:hover .bcard-flipper { transform: rotateY(180deg); }
    .bcard-flipper { transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; position: relative; width: 100%; height: 100%; }
    .bcard-front, .bcard-back { backface-visibility: hidden; position: absolute; inset: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid var(--dim); }
    .bcard-front { z-index: 2; transform: rotateY(0deg); }
    .bcard-back { transform: rotateY(180deg); }
    .bcard-img { width: 100%; height: 100%; object-fit: cover; }
    .click-hint { font-family: var(--font-mono); font-size: 10px; color: var(--gold); text-align: center; margin-top: 16px; letter-spacing: 2px; animation: pulse-text 2s infinite; }
    @keyframes pulse-text { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* Interactive Terminal Input */
    .term-input-row { display: flex; gap: 12px; align-items: center; }
    .term-input { background: transparent; border: none; color: var(--chalk); font-family: var(--font-mono); font-size: 13px; flex: 1; outline: none; caret-color: var(--gold); }
    
    /* Floating AI Bot & Suggestions */
    .ai-bot-btn { transition: transform 0.3s cubic-bezier(0.34,1.56,.64,1), box-shadow 0.3s, border-color 0.3s; }
    .ai-bot-btn:hover { transform: scale(1.1); box-shadow: 0 12px 32px rgba(201,168,76,.3); border-color: var(--goldL) !important; }
    #ai-chat-window { opacity: 0; transform: translateY(10px) scale(0.95); transition: opacity 0.3s, transform 0.3s cubic-bezier(0.34,1.56,.64,1); transform-origin: bottom left; }
    
    .quick-reply-btn {
      background: var(--bg3); border: 1px solid var(--dim); color: var(--silver); padding: 6px 12px;
      border-radius: 100px; font-size: 11px; font-family: var(--font-ui); cursor: pointer;
      white-space: nowrap; transition: all 0.2s;
    }
    .quick-reply-btn:hover { background: rgba(201,168,76,0.1); border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
    
    .typing-dots span { animation: blink 1.4s infinite both; font-size: 16px; line-height: 1; margin: 0 1px; color: var(--silver); }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    #ai-chat-messages::-webkit-scrollbar { width: 4px; }
    #ai-chat-messages::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

    /* Scroll to Top Button */
    #scroll-top-btn { position: fixed; bottom: 32px; right: 32px; z-index: 999; width: 48px; height: 48px; border-radius: 50%; background: var(--bg2); border: 1px solid var(--dim); color: var(--silver); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.34,1.56,.64,1); transform: translateY(20px); }
    #scroll-top-btn.visible { opacity: 1; pointer-events: all; transform: translateY(0); }
    #scroll-top-btn.visible:hover { background: var(--gold); color: var(--bg0); border-color: var(--gold); transform: translateY(-4px); }
  </style>
</head>

  <script>
/* ════════════════════════════════════════════════════════════════════
       DÉTAILS DES MODALES (REMPLACE LES FICHIERS JSON EXTERNES)
       Ici vous pouvez facilement éditer le texte détaillé de chaque élément.
    ════════════════════════════════════════════════════════════════════ */
    const EXPANDED_DATA = {
      fr: {
        xps: [

énérique saturée, j'ai piloté (avec l'équipe "Besoins non planifiés" et le prestataire T-Lab) la création de RAID, une application de ticketing centralisée pour toutes les réclamations, litiges et suivis DSB.</li><li><strong>Projet Cantilever (Limay) :</strong> Étude et mise en œuvre du réaménagement complet d'une zone de stockage pour les matériaux de "grandes longueurs" chez Geodis. Démontage, transfert, et installation tout en gérant les contraintes techniques (dénivelé du sol) et de sécurité.</li><li><strong>Optimisation des Livraisons :</strong> Intégration de points GPS précis sur les fiches protocolaires de livraison pour les chauffeurs GEODIS, réduisant drastiquement les erreurs d'acheminement.</li></ul>` },

const hexToRgb = hex => { const n=parseInt(hex.replace("#",""),16); return `${(n>>16)&255},${(n>>8)&255},${n&255}`; };

function hexToRgbA(hex, alpha){
    let c;
    if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
        c = hex.substring(1).split('');
        if(c.length == 3) c = [c[0], c[0], c[1], c[1], c[2], c[2]];
        c = '0x' + c.join('');
        return 'rgba(' + [(c>>16)&255, (c>>8)&255, c&255].join(',') + ',' + alpha + ')';
    }
    return `rgba(200,200,200,${alpha})`;
}
// Détection automatique de la langue
function autoDetectLanguage() {
  // navigator.language retourne des valeurs comme 'fr-FR', 'en-US', 'de', 'ru-RU'
  const browserLang = (navigator.language || navigator.userLanguage).substring(0, 2).toLowerCase();
  
  // Liste de tes langues supportées
  const supportedLangs = ['fr', 'en', 'de', 'ru'];
  
  // Si la langue du navigateur est supportée, on l'utilise, sinon on force l'anglais
  if (supportedLangs.includes(browserLang)) {
    currentLang = browserLang;
  } else {
    currentLang = 'en';
  }
}

      if(!text) return '';
      const glossary = DICT[currentLang].glossary;
      if(!glossary) return text;
      let res = text;
      for(const [term, def] of Object.entries(glossary)) {
        const regex = new RegExp(`\\b(${term})\\b`, 'g');
        res = res.replace(regex, `<span class="glossary-term" data-def="${def}">$1</span>`);
      }
      return res;
    }

    function openModal(category, index) {
      const t = DICT[currentLang];

      let item, details = null;

      if(category === 'xp') { item = t.xps[index]; details = expandedData.xps?.[index]; }
      if(category === 'proj') { item = t.projects[index]; details = expandedData.projects?.[index]; }
      if(category === 'edu') { item = t.schools[index]; details = expandedData.schools?.[index]; }
      if(category === 'future') { item = t.future[index]; details = expandedData.future?.[index]; }

      if(!item) return;

      $('modal-title').textContent = item.title || item.role || item.school;
      $('modal-subtitle').textContent = item.co || item.type || item.degree;
      
      const body = $('modal-body');
      let html = "";
      
      // Inject tags
      const tags = item.tags ? `<div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">${item.tags.map(tag => `<span style="background:rgba(255,255,255,0.05);border:1px solid var(--dim);color:var(--silver);padding:4px 10px;border-radius:6px;font-size:11px;font-family:var(--font-mono)">${tag}</span>`).join('')}</div>` : '';
      html += tags;

      // Inject Expanded Content
      if (details && details.content) {
        html += details.content;
      } else {
        html += `<p style="font-style:italic">${t.modalFallback}</p>`;
      }

      body.innerHTML = html;
      $('global-modal').classList.add('open');
      document.body.style.overflow = 'hidden'; // prevent bg scroll
    }

    function makeChatDraggable() {
      let isDragging = false, offsetX, offsetY, win;
      document.addEventListener('mousedown', (e) => {
        if (e.target.closest('#ai-chat-header')) {
          win = $('ai-chat-window');
          if (!win) return;
          isDragging = true;
          const rect = win.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
          
          win.style.bottom = 'auto'; 
          win.style.right = 'auto';
          win.style.position = 'fixed';
          win.style.left = `${rect.left}px`;
          win.style.top = `${rect.top}px`;
        }
      });
      document.addEventListener('mousemove', (e) => {
        if (isDragging && win) {
          win.style.left = `${e.clientX - offsetX}px`;
          win.style.top = `${e.clientY - offsetY}px`;
        }
      });
      document.addEventListener('mouseup', () => { isDragging = false; });
    }

    // ══════ CS:GO RADIAL MENU LOGIC (TEXTE SUR 2 LIGNES + COULEURS) ══════
    function openRadialMenu() {
      const overlay = $('radial-menu-overlay');
      const container = $('radial-items');
      
      const themes = Object.values(THEMES).filter(t => t.id !== 'hack');
      const N = themes.length;
      const angleStep = 360 / N;
      
      // Tailles augmentées pour que le texte rentre parfaitement
      const Center = 300;
      const R_in = 50;   
      const R_out = 280; 
      const R_text = 175; // Éloigne un peu plus le texte du centre
      
      let svgHtml = `<svg viewBox="0 0 600 600" style="width:600px; height:600px; filter:drop-shadow(0 10px 30px rgba(0,0,0,0.8));">`;
      
      themes.forEach((th, i) => {
        const startAngle = (i - 0.5) * angleStep - 90;
        const endAngle = (i + 0.5) * angleStep - 90;
        const midAngle = i * angleStep - 90;
        
        const radS = startAngle * Math.PI / 180;
        const radE = endAngle * Math.PI / 180;
        const radM = midAngle * Math.PI / 180;
        
        const p1x = Center + R_in * Math.cos(radS), p1y = Center + R_in * Math.sin(radS);
        const p2x = Center + R_out * Math.cos(radS), p2y = Center + R_out * Math.sin(radS);
        const p3x = Center + R_out * Math.cos(radE), p3y = Center + R_out * Math.sin(radE);
        const p4x = Center + R_in * Math.cos(radE), p4y = Center + R_in * Math.sin(radE);
        
        const d = `M ${p1x} ${p1y} L ${p2x} ${p2y} A ${R_out} ${R_out} 0 0 1 ${p3x} ${p3y} L ${p4x} ${p4y} A ${R_in} ${R_in} 0 0 0 ${p1x} ${p1y} Z`;
        
        const textX = Center + R_text * Math.cos(radM);
        const textY = Center + R_text * Math.sin(radM);

        // Découpage du texte en 2 lignes si nécessaire (" & " ou " (")
        let part1 = th.name;
        let part2 = "";
        if (th.name.includes(" & ")) {
            let split = th.name.split(" & ");
            part1 = split[0];
            part2 = "& " + split[1];
        } else if (th.name.includes(" (")) {
            let split = th.name.split(" (");
            part1 = split[0];
            part2 = "(" + split[1];
        }

        // Coloration : Ligne 1 avec la couleur 'gold', Ligne 2 avec la couleur 'azure'
        let textContent = `<tspan x="${textX}" dy="${part2 ? '-0.6em' : '0'}" fill="${th.gold}" font-size="12">${part1.toUpperCase()}</tspan>`;
        if (part2) {
            textContent += `<tspan x="${textX}" dy="1.4em" fill="${th.azure}" font-size="10">${part2.toUpperCase()}</tspan>`;
        }

        svgHtml += `
          <g style="cursor:pointer;" 
             onmouseenter="hoverTheme('${th.id}', this)" 
             onmouseleave="leaveTheme(this)" 
             onclick="setTheme('${th.id}'); closeRadialMenu();">
            <path d="${d}" fill="rgba(20, 25, 35, 0.75)" stroke="var(--dim)" stroke-width="2" style="transition:all 0.15s ease-out;"></path>
            <text x="${textX}" y="${textY}" font-family="var(--font-mono)" font-weight="700" text-anchor="middle" dominant-baseline="middle" letter-spacing="1" style="transition:all 0.15s ease-out; transform-origin: ${textX}px ${textY}px; pointer-events:none;">
               ${textContent}
            </text>
          </g>
        `;
      });
      
      svgHtml += `</svg>`;
      container.innerHTML = svgHtml;

      overlay.style.display = 'flex';
      setTimeout(() => overlay.style.opacity = '1', 10);
    }

    function initObservers() {
      if(activeObserver) activeObserver.disconnect();
      activeObserver = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if(e.target.tagName.toLowerCase() === 'section') {
            const rect = e.target.getBoundingClientRect();
            if(rect.top < 0 && rect.bottom > 0) {
              const progress = Math.min(1, Math.abs(rect.top) / window.innerHeight);
              e.target.style.opacity = 1 - (progress * 0.3);
              e.target.style.transform = `translateY(${progress * 20}px)`;
            } else {
              e.target.style.opacity = 1;
              e.target.style.transform = 'none';
            }
          }
          
          if (e.isIntersecting && e.target.classList.contains('reveal')) {
            e.target.classList.add('on');
            const bars = e.target.querySelectorAll('.anim-bar');
            bars.forEach(b => b.style.width = b.dataset.width + '%');
            
            if(e.target.classList.contains('term-box') && !e.target.dataset.run) {
              e.target.dataset.run = '1'; 
              runTermAnim();
            }
          }
        });
      }, { threshold: 0.1 });
      
      document.querySelectorAll('.reveal').forEach(el => activeObserver.observe(el));
      document.querySelectorAll('main > section').forEach(el => {
        window.addEventListener('scroll', () => {
          const rect = el.getBoundingClientRect();
          if(rect.top < 0 && rect.bottom > 0) {
            const progress = Math.min(1, Math.abs(rect.top) / window.innerHeight);
            el.style.opacity = 1 - (progress * 0.3); 
            el.style.transform = `translateY(${progress * 20}px)`;
          } else {
            el.style.opacity = 1;
            el.style.transform = 'none';
          }
        }, {passive:true});
      });
    }

    function initCounters() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.querySelectorAll('.stat-counter').forEach(el => {
              if (el.dataset.done) return; el.dataset.done = '1';
              const target = parseFloat(el.dataset.target);
              let start;
              const step = ts => {
                if(!start) start = ts; const p = Math.min((ts - start)/1600, 1);
                el.textContent = Math.round((1 - Math.pow(1-p, 4)) * target);
                if (p < 1) requestAnimationFrame(step);
              };
              requestAnimationFrame(step);
            });
          }
        });
      });
      const hsg = document.querySelector('.hsg');
      if(hsg) obs.observe(hsg);
    }

      const canvas = $('particle-canvas');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      let mouse = {x:-999, y:-999};
      const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
      window.addEventListener('resize', resize, {passive:true}); resize();
      window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, {passive:true});

      const pts = Array.from({length: 50}, () => ({
        x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        vx: (Math.random()-.5)*.3, vy: (Math.random()-.5)*.3, r: Math.random()*1.2+.4, ph: Math.random()*Math.PI*2,
        col: ['gold','azure','silver','slate'][Math.floor(Math.random()*4)],
        char: Math.random() > 0.5 ? '1' : '0' 
      }));

      const draw = ts => {
        if(!isPageVisible) { canvasRAF = requestAnimationFrame(draw); return; }
        
        if (isHackMode) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
          ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle = '#10d68a';
          ctx.font = '14px monospace';
          pts.forEach(p => {
            p.y += 3 + Math.random()*2;
            if(p.y > canvas.height) { p.y = 0; p.x = Math.random()*canvas.width; }
            if(Math.random()<0.05) p.char = Math.random() > 0.5 ? '1' : '0';
            ctx.fillText(p.char, p.x, p.y);
          });
        } else {
          ctx.clearRect(0,0,canvas.width,canvas.height);
          const cG = hexToRgb(getVar('gold')), cS = hexToRgb(getVar('slate'));
          
          pts.forEach(p => {
            const d = Math.hypot(mouse.x - p.x, mouse.y - p.y);
            if(d < 180) { ctx.beginPath(); ctx.strokeStyle=`rgba(${cG},${.15*(1-d/180)})`; ctx.moveTo(p.x,p.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke(); }
          });
          for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++) {
            const d = Math.hypot(pts[i].x-pts[j].x, pts[i].y-pts[j].y);
            if(d < 120) { ctx.beginPath(); ctx.strokeStyle=`rgba(${cS},${.3*(1-d/120)})`; ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); }
          }
          pts.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0||p.x>canvas.width) p.vx*=-1; if(p.y<0||p.y>canvas.height) p.vy*=-1;
            ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1+(Math.sin(ts*.001+p.ph)*.5+.5)*.4),0,Math.PI*2);
            ctx.fillStyle = `rgba(${hexToRgb(getVar(p.col))}, 0.6)`; ctx.fill();
          });
        }
        canvasRAF = requestAnimationFrame(draw);
      };
      canvasRAF = requestAnimationFrame(draw);
    }

    /* ════════════════════════════════════════════════════════════════════
       CUSTOM CURSOR
    ════════════════════════════════════════════════════════════════════ */
    function initCursor() {
      if(!window.matchMedia("(pointer:fine)").matches) return;
      const dot = $('cursor-dot'), ring = $('cursor-ring');
      dot.style.display = 'block'; ring.style.display = 'block';
      let mx=-200, my=-200, rx=-200, ry=-200, hov=false;
      window.addEventListener('mousemove', e => { 
        mx=e.clientX; my=e.clientY; 
        const target = e.target.closest('.gc');
        if(target) {
          const rect = target.getBoundingClientRect();
          target.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
          target.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        }
      }, {passive:true});
      
      document.addEventListener('mouseover', e => { if(e.target.closest('a,button,[role=button],.dash-btn,input,.flip-container,.reco-card,.glossary-term,.quick-reply-btn,.gc')) hov=true; });
      document.addEventListener('mouseout', () => hov=false);
      const tick = () => {
        rx += (mx - rx)*.15; ry += (my - ry)*.15;
        dot.style.transform = `translate(${mx-4}px,${my-4}px) scale(${hov ? 0.3 : 1})`;
        ring.style.transform = `translate(${rx-20}px,${ry-20}px) scale(${hov?2:1})`;
        ring.style.opacity = hov?".5":".3";
        requestAnimationFrame(tick);
      };  
      requestAnimationFrame(tick);
    }

    /* ════════════════════════════════════════════════════════════════════
       ACTIVE SECTION SCROLL SPY & CMD+K BINDING
    ════════════════════════════════════════════════════════════════════ */
    function setupEventListeners() {
      document.addEventListener('click', e => {
        if (!e.target.closest('.dd')) {
          document.querySelectorAll('.dd').forEach(el => { el.classList.remove('open'); });
        }
      });

      document.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); toggleCmdPalette(); }
        if(e.key === 'Escape') {
          document.querySelectorAll('.dd').forEach(el => el.classList.remove('open'));
          closeMobileMenu();
          if($('cmd-palette') && $('cmd-palette').style.display === 'flex') toggleCmdPalette();
          if($('global-modal').classList.contains('open')) closeModal();
          if($('radial-menu-overlay') && $('radial-menu-overlay').style.display === 'flex') closeRadialMenu();
        }
      });
      window.addEventListener('scroll', () => {
        const sids = SIDS;
        const mid = window.scrollY + window.innerHeight * 0.4;
        let active = sids[0];
        for(let i=sids.length-1; i>=0; i--) {
          const el = $(sids[i]+'-wrap');
          if(el && el.offsetTop <= mid) { active = sids[i]; break; }
        }
        document.querySelectorAll('.nav-link').forEach(l => {
          const isActive = l.getAttribute('href') === anchorFor(active);
          l.style.background = isActive ? 'rgba(255,255,255,0.05)' : 'transparent';
          l.style.color = isActive ? 'var(--chalk)' : 'var(--silver)';
        });
        document.querySelectorAll('.dot-link').forEach(l => {
          const on = l.getAttribute('href') === anchorFor(active);
          const ind = l.querySelector('.dot-indicator');
          const lbl = l.querySelector('.dot-label');
          if(ind) { ind.style.background = on ? 'var(--gold)' : 'var(--slate)'; ind.style.width = on ? '26px' : '6px'; }
          if(lbl) lbl.style.display = on ? 'block' : 'none';
        });
        
        const nb = $('navbar');
        if(nb) {
          nb.style.background = window.scrollY > 20 ? 'rgba(6,11,22,0.85)' : 'transparent';
          nb.style.backdropFilter = window.scrollY > 20 ? 'blur(20px)' : 'none';
          nb.style.borderBottom = window.scrollY > 20 ? '1px solid rgba(255,255,255,0.05)' : 'none';
        }
        
        const stBtn = $('scroll-top-btn');
        if (stBtn) {
          if (window.scrollY > 400) stBtn.classList.add('visible');
          else stBtn.classList.remove('visible');
        }
      }, {passive:true});
    }

    // Initialize App
    window.addEventListener('load', () => {
      init();
      setTimeout(() => {
        const p = $('preloader');
        if(p) { p.style.opacity = '0'; p.style.visibility = 'hidden'; setTimeout(() => p.remove(), 800); }
      }, 1000);
    });

  </script>
</body>
